name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run e2e
      # The plugin ships bin/parley.mjs: it must be what src/ builds to.
      - run: bun run build:plugin && git diff --exit-code --stat bin/parley.mjs
